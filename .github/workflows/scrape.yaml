name: Scrape latest data

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '40 4 * * 5'  # 04:40 UTC on Friday

jobs:
  scheduled:
    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        activate-environment: true

    - name: Install the project
      run: uv sync --locked --all-extras --dev

    - name: Overpass API status
      run: |
        uv run overpass_api_status.py --check-available-slots --verbose

    - name: Fetch latest data
      run: |
        make clean
        make download

    - name: Inspect downloaded json
      if: ${{ !cancelled() }}
      run: |
        head -c 500 downloads/*.json

    - name: Build geojson of distances from shops to bicycle parking
      run: |
        uv run main.py --amenities downloads/shops.json --parking ./downloads/bicycle-parking.json --output distance_from_shops_to_nearest_bicycle_parking.geojson

    - name: Build geojson of distances from buildings to bicycle parking
      run: |
        uv run main.py --amenities downloads/buildings.json --parking ./downloads/bicycle-parking.json --output distance_from_buildings_to_nearest_bicycle_parking.geojson

    # catchment lines
    - name: Build geojson of catchment lines from shops to bicycle parking
      run: |
        uv run main.py --amenities downloads/shops.json --parking ./downloads/bicycle-parking.json --output catchment_from_shops_to_nearest_bicycle_parking.geojson --catchment-lines

    - name: Build geojson of catchment lines from buildings to bicycle parking
      run: |
        uv run main.py --amenities downloads/buildings.json --parking ./downloads/bicycle-parking.json --output catchment_from_buildings_to_nearest_bicycle_parking.geojson --catchment-lines

    # cars
    - name: Build geojson of distances from shops to automobile parking
      run: |
        uv run main.py --amenities downloads/shops.json --parking ./downloads/car-parking.json --output distance_from_shops_to_nearest_car-parking.geojson

    - name: Build geojson of distances from buildings to automobile parking
      run: |
        uv run main.py --amenities downloads/buildings.json --parking ./downloads/car-parking.json --output distance_from_buildings_to_nearest_car-parking.geojson

    # experiment, disparity
    - name: Build geojson of distances from shops to bicycle parking
      continue-on-error: true
      run: |
        uv run main.py --amenities downloads/shops.json --parking ./downloads/bicycle-parking.json --disparity-with ./downloads/car-parking.json --output distance_from_shops_to_nearest_bicycle_parking_disparity_vs_car_parking.geojson

    - name: Build geojson of distances from shops to transit
      continue-on-error: true
      run: |
        uv run main.py --amenities downloads/shops.json --parking ./downloads/transit.json --disparity-with ./downloads/car-parking.json --output distance_from_shops_to_nearest_transit_disparity_vs_car_parking.geojson

    - name: Commit and push if it changed
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        branch: main
        file_pattern: '*.geojson'
        commit_user_name: GitHub Actions # defaults to "GitHub Actions"
        commit_user_email: actions@github.com # defaults to "actions@github.com"
        commit_author: GitHub Actions <actions@github.com> # defaults to author of the commit that triggered the run

  issue:
    needs: [scheduled]
    runs-on: ubuntu-latest
    if: ${{ failure() }}

    permissions:
      issues: write

    steps:
    - name: Get current date in NOW env variable
      run: echo "NOW=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    - name: Report issue on failure
      env:
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        GH_TOKEN: ${{ github.token }}
      run: |
        gh issue create --title "Failed job $NOW" --repo "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" --body "$RUN_URL"
