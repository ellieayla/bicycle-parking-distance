name: Scrape latest data

on:
  push:
  workflow_dispatch:
  #schedule:
  #  - cron: '39 2 * * *'  # 02:39 UTC every day

jobs:
  scheduled:
    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: "Set up Python"
      uses: actions/setup-python@v6
      with:
        python-version-file: ".python-version"

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install the project
      run: uv sync --locked --all-extras --dev

    - name: Fetch latest data
      run: |
        make clean
        make download

    - name: Build geojson of distances
      run: |
        uv run main.py --amenities downloads/shops.json --parking ./downloads/bicycle-parking.json --output distance_from_shops_to_nearest_bicycle_parking.geojson

    - name: Commit and push if it changed
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        branch: main
        file_pattern: '*.geojson'
        commit_user_name: GitHub Actions # defaults to "GitHub Actions"
        commit_user_email: actions@github.com # defaults to "actions@github.com"
        commit_author: GitHub Actions <actions@github.com> # defaults to author of the commit that triggered the run
