[project]
name = "bicycle-parking-distance"
version = "0.1.0"
description = "Find the distance to nearest bicycle parking for a collection of OSM POIs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "geojson>=3.2.0",
    "numpy>=2.4.1",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
]

[dependency-groups]
dev = [
    "lxml>=6.0.2",
    "mypy>=1.19.1",
    "pandas-stubs>=2.3.3.260113",
    "pytest>=9.0.2",
    "scikit-learn-stubs>=0.0.3",
]

[tool.mypy]
check_untyped_defs = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
warn_return_any = true
disallow_untyped_defs = true

files = "main.py"
exclude = "tests_.*.py"

[[tool.mypy.overrides]]
module = ["geojson.*"]
follow_untyped_imports = true

# uv tool run pytest-watcher -sv .
[tool.pytest-watcher]
now = true
clear = true
notify_on_failure = false
delay = 0.2
runner = "uv"
runner_args = ["run", "pytest"]
patterns = ["*.py"]
ignore_patterns = []

[tool.ruff]
line-length = 200

[tool.ruff.format]
quote-style = "preserve"
exclude = ["test_*.py"]
